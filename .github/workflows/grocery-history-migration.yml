name: Apply grocery history migration

on:
  push:
    branches: [main]
    paths: [.github/workflows/grocery-history-migration.yml]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply pending D1 migration
        run: |
          npm run deploy:config
          npx --no-install wrangler d1 migrations apply DB --remote --config .wrangler.deploy.json
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
