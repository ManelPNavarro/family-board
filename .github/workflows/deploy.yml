name: Family Board

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-board-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check Worker bundle
        run: npx --no-install wrangler deploy --config wrangler.json --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Prepare and deploy the Worker
        if: github.ref == 'refs/heads/main' && vars.D1_DATABASE_ID != ''
        run: |
          npm run deploy:config
          if [[ -n "$GOOGLE_CALENDAR_ID" || -n "$GOOGLE_CALENDAR_SERVICE_ACCOUNT" || -n "$WEATHER_LOCATION" || -n "$TUYA_LIGHT" ]]; then
            secrets_file="$(mktemp "$RUNNER_TEMP/family-board-secrets.XXXXXX")"
            trap 'rm -f "$secrets_file"' EXIT
            node scripts/worker-secrets.mjs > "$secrets_file"
            npx --no-install wrangler deploy --config .wrangler.deploy.json --secrets-file "$secrets_file"
          else
            npx --no-install wrangler deploy --config .wrangler.deploy.json
          fi
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          ACCESS_TEAM: ${{ vars.ACCESS_TEAM }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_CALENDAR_SERVICE_ACCOUNT }}
          WEATHER_LOCATION: ${{ secrets.WEATHER_LOCATION }}
          TUYA_LIGHT: ${{ secrets.TUYA_LIGHT }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Report pending Cloudflare setup
        if: github.ref == 'refs/heads/main' && vars.D1_DATABASE_ID == ''
        run: echo 'Despliegue pendiente de configurar Cloudflare. Consulta el README.' >> "$GITHUB_STEP_SUMMARY"
